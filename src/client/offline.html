<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d110b">
  <meta name="color-scheme" content="dark">
  <title>Insight</title>
  <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="/offline.css">
  <script src="/offline.js" defer></script>
</head>
<body>
  <!-- Shown by the service worker (sw.js) when a page cannot load; in English
       by offline.js where the game plays in English on this phone. -->
  <main class="screen screen--center">
    <section class="system-panel">
      <div class="system-message">
        <p class="system-label">[ SYSTEM ]</p>
        <p class="system-text" data-en="No network connection. The server keeps the time and results of explorations, so the game needs the internet.">Brak połączenia z siecią. Czas wypraw i ich wyniki liczy serwer, więc gra potrzebuje internetu.</p>
        <p class="system-text" data-en="Your explorations go on. Come back when the connection returns.">Wyprawy trwają dalej. Wróć, gdy połączenie wróci.</p>
      </div>
      <a class="button button--system" href="/" data-en="Try again">Spróbuj ponownie</a>
    </section>
  </main>
</body>
</html>
