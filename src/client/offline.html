<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d110b">
  <meta name="color-scheme" content="dark">
  <title>Insight</title>
  <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="/offline.css">
</head>
<body>
  <!-- Shown by the service worker (sw.js) when a page cannot load. -->
  <main class="screen screen--center">
    <section class="system-panel">
      <div class="system-message">
        <p class="system-label">[ SYSTEM ]</p>
        <p class="system-text">Brak połączenia z siecią. Czas wypraw i ich wyniki liczy serwer, więc gra potrzebuje internetu.</p>
        <p class="system-text">Wyprawy trwają dalej. Wróć, gdy połączenie wróci.</p>
      </div>
      <a class="button button--system" href="/">Spróbuj ponownie</a>
    </section>
  </main>
</body>
</html>
