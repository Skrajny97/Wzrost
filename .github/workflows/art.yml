# Draws sprite drafts with Retro Diffusion (tools/generate-art.mjs), the
# evolution portraits, the walks' start frames, the creatures, materials and
# busts, the places' circles, the lands and the Osada's buildings with PixelLab
# (kinds evolutions-, walk-starts-, monsters-, materials-, residents-, areas-,
# lands-, settlement-, pets-, pets-portrait-, gems-, scrolls-, places-, professions-, salon-,
# salon-small-, scenes-, scenes-hd-, skins-, fortress-, fortress-board- (the Warownia's
# board, drawn into the camp's by inpainting), items- and potions-pixellab,
# "variants" are calls, of one to 64 versions each by size,
# tools/generate-portraits-pixellab.mjs), or the
# walks animated by PixelLab (kind walks-pixellab, tools/animate-walks.mjs;
# walks-skeleton-estimate reads the skeleton of their start frames),
# the mounts posed frame by frame (mounts-skeleton, tools/animate-mounts-skeleton.mjs),
# the Sklep Systemu's pets animated by PixelLab (pets-animate, tools/animate-mounts.mjs),
# the professions' work scenes animated with their backgrounds (scenes-animate),
# and keeps them on the art-drafts branch for review. Run by hand from the
# Actions tab or the API; it never deploys anything. Needs the
# RETRO_DIFFUSION_API_KEY secret, and PIXELLAB_API_KEY for the walks.

name: Grafiki (szkice)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Rodzaj grafik
        required: true
        default: monsters
        type: choice
        options:
          - monsters
          - items
          - portraits
          - evolutions
          - evolutions-pixellab
          - events-pixellab
          - monsters-pixellab
          - materials-pixellab
          - residents-pixellab
          - walk-starts-pixellab
          - areas-pixellab
          - lands-pixellab
          - settlement-pixellab
          - pets-pixellab
          - pets-portrait-pixellab
          - gems-pixellab
          - scrolls-pixellab
          - places-pixellab
          - professions-pixellab
          - salon-pixellab
          - salon-small-pixellab
          - scenes-pixellab
          - scenes-hd-pixellab
          - fortress-pixellab
          - fortress-board-pixellab
          - items-pixellab
          - potions-pixellab
          - skins-pixellab
          - pets-animate
          - scenes-animate
          - materials
          - resources
          - narrator
          - skills
          - areas
          - lands
          - logo
          - camp
          - board
          - herbs
          - potions
          - professions
          - places
          - animations
          - events
          - icons
          - cosmetics
          - mounts
          - mounts-pixellab
          - mounts-skeleton-estimate
          - mounts-skeleton
          - riders
          - settlement
          - residents
          - walks
          - walks-pixellab
          - walks-skeleton-estimate
      ids:
        description: Identyfikatory po przecinku albo all
        required: true
        default: all
      variants:
        description: Ile wersji każdej grafiki (1–4)
        required: true
        default: '1'
      style:
        description: Styl Retro Diffusion (puste = z art/prompts.json)
        required: false
        default: ''
      max_cost:
        description: Najwięcej dolarów na ten przebieg
        required: true
        default: '2'
      dry_run:
        description: Tylko wycena, bez generowania
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: art-drafts
  cancel-in-progress: false

jobs:
  drafts:
    name: Szkice
    runs-on: ubuntu-latest
    # A whole camp (27 pictures, about a minute each) needs more than half an
    # hour, twenty walks animated four at a time (3-5 minutes each) about as much.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generowanie
        env:
          RETRO_DIFFUSION_API_KEY: ${{ secrets.RETRO_DIFFUSION_API_KEY }}
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
          KIND: ${{ inputs.kind }}
          IDS: ${{ inputs.ids }}
          VARIANTS: ${{ inputs.variants }}
          STYLE: ${{ inputs.style }}
          MAX_COST: ${{ inputs.max_cost }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$KIND" = "walks-pixellab" ] || [ "$KIND" = "walks-skeleton-estimate" ]; then
            args=(--ids "$IDS" --variants "$VARIANTS" --max-cost "$MAX_COST")
            if [ "$KIND" = "walks-skeleton-estimate" ]; then args+=(--estimate); fi
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            node tools/animate-walks.mjs "${args[@]}"
            exit
          fi
          if [ "$KIND" = "mounts-skeleton-estimate" ] || [ "$KIND" = "mounts-skeleton" ]; then
            args=(--ids "$IDS" --variants "$VARIANTS" --max-cost "$MAX_COST")
            if [ "$KIND" = "mounts-skeleton-estimate" ]; then args+=(--estimate); fi
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            node tools/animate-mounts-skeleton.mjs "${args[@]}"
            exit
          fi
          if [ "$KIND" = "evolutions-pixellab" ] || [ "$KIND" = "events-pixellab" ] || [ "$KIND" = "walk-starts-pixellab" ] || [ "$KIND" = "monsters-pixellab" ] || [ "$KIND" = "materials-pixellab" ] || [ "$KIND" = "residents-pixellab" ] || [ "$KIND" = "areas-pixellab" ] || [ "$KIND" = "lands-pixellab" ] || [ "$KIND" = "settlement-pixellab" ] || [ "$KIND" = "pets-pixellab" ] || [ "$KIND" = "pets-portrait-pixellab" ] || [ "$KIND" = "gems-pixellab" ] || [ "$KIND" = "scrolls-pixellab" ] || [ "$KIND" = "places-pixellab" ] || [ "$KIND" = "professions-pixellab" ] || [ "$KIND" = "salon-pixellab" ] || [ "$KIND" = "salon-small-pixellab" ] || [ "$KIND" = "scenes-pixellab" ] || [ "$KIND" = "scenes-hd-pixellab" ] || [ "$KIND" = "fortress-pixellab" ] || [ "$KIND" = "fortress-board-pixellab" ] || [ "$KIND" = "items-pixellab" ] || [ "$KIND" = "potions-pixellab" ] || [ "$KIND" = "skins-pixellab" ]; then
            args=(--kind "${KIND%-pixellab}" --ids "$IDS" --calls "$VARIANTS" --max-cost "$MAX_COST")
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            node tools/generate-portraits-pixellab.mjs "${args[@]}"
            exit
          fi
          if [ "$KIND" = "pets-animate" ]; then
            args=(--config art/pets.json --group pets --out art/drafts/pets-animate --title "Animacje chowańców (PixelLab)" --label Chowaniec --ids "$IDS" --variants "$VARIANTS" --max-cost "$MAX_COST")
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            node tools/animate-mounts.mjs "${args[@]}"
            exit
          fi
          if [ "$KIND" = "scenes-animate" ]; then
            args=(--config art/scenes.json --group scenes --out art/drafts/scenes-animate --title "Animacje scen pracy (PixelLab)" --label Scena --ids "$IDS" --variants "$VARIANTS" --max-cost "$MAX_COST")
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            node tools/animate-mounts.mjs "${args[@]}"
            exit
          fi
          if [ "$KIND" = "mounts-pixellab" ]; then
            args=(--ids "$IDS" --variants "$VARIANTS" --max-cost "$MAX_COST")
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            node tools/animate-mounts.mjs "${args[@]}"
            exit
          fi
          args=(--kind "$KIND" --ids "$IDS" --variants "$VARIANTS" --style "$STYLE" --max-cost "$MAX_COST")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node tools/generate-art.mjs "${args[@]}"
      # Also after a failed drawing: the drafts already paid for are kept.
      - name: Zapis na gałęzi art-drafts
        if: ${{ always() && !inputs.dry_run }}
        env:
          KIND: ${{ inputs.kind }}
          IDS: ${{ inputs.ids }}
        run: |
          [ -d art/drafts ] || exit 0
          mkdir -p "$RUNNER_TEMP/drafts" && cp -r art/drafts/. "$RUNNER_TEMP/drafts/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin art-drafts; then
            git checkout -f -B art-drafts FETCH_HEAD
          else
            git checkout --orphan art-drafts
            git rm -rf --quiet .
          fi
          mkdir -p art/drafts && cp -r "$RUNNER_TEMP/drafts/." art/drafts/
          git add -f art/drafts
          git commit -m "Szkice grafik: $KIND ($IDS)" || exit 0
          # A push cut off by GitHub (HTTP 408 on 4.11.2026) would lose drafts
          # already paid for: it tries again, after 2, 4, 8 and 16 seconds.
          for wait in 2 4 8 16; do
            git push origin art-drafts && exit 0
            echo "Zapis się nie udał, ponowienie za $wait s"
            sleep "$wait"
          done
          git push origin art-drafts
