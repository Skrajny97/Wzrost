# Records sound drafts with ElevenLabs Sound Effects (tools/generate-sfx.mjs)
# and keeps them on the art-drafts branch for review. Run by hand from the
# Actions tab or the API; it never deploys anything. Needs the
# ELEVENLABS_API_KEY secret.

name: Dźwięki (szkice)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Rodzaj dźwięków
        required: true
        default: voices
        type: choice
        options:
          - voices
          - effects
          - ui
          - narration
          - narrationEn
      ids:
        description: Identyfikatory po przecinku albo all
        required: true
        default: all
      variants:
        description: Ile wersji każdego dźwięku (1–4)
        required: true
        default: '1'
      max_credits:
        description: Najwięcej kredytów ElevenLabs na ten przebieg
        required: true
        default: '200'
      dry_run:
        description: Tylko wycena, bez nagrywania
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# The same queue as the art drafts: both push to art-drafts.
concurrency:
  group: art-drafts
  cancel-in-progress: false

jobs:
  drafts:
    name: Szkice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Nagrywanie
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          KIND: ${{ inputs.kind }}
          IDS: ${{ inputs.ids }}
          VARIANTS: ${{ inputs.variants }}
          MAX_CREDITS: ${{ inputs.max_credits }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--kind "$KIND" --ids "$IDS" --variants "$VARIANTS" --max-credits "$MAX_CREDITS")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node tools/generate-sfx.mjs "${args[@]}"
      # Also after a failed sound: the ones already paid for are kept.
      - name: Zapis na gałęzi art-drafts
        if: ${{ always() && !inputs.dry_run }}
        env:
          KIND: ${{ inputs.kind }}
          IDS: ${{ inputs.ids }}
        run: |
          [ -d audio/drafts ] || exit 0
          mkdir -p "$RUNNER_TEMP/drafts" && cp -r audio/drafts/. "$RUNNER_TEMP/drafts/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin art-drafts; then
            git checkout -f -B art-drafts FETCH_HEAD
          else
            git checkout --orphan art-drafts
            git rm -rf --quiet .
          fi
          mkdir -p audio/drafts && cp -r "$RUNNER_TEMP/drafts/." audio/drafts/
          git add -f audio/drafts
          git commit -m "Szkice dźwięków: $KIND ($IDS)" || exit 0
          git push origin art-drafts
