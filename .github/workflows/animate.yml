# Animates the walks with PixelLab (tools/animate-walks.mjs) and keeps the
# drafts on the art-drafts branch for review, next to the Retro Diffusion ones.
# Run by hand from the Actions tab or the API; it never deploys anything.
# Needs the PIXELLAB_API_KEY secret.

name: Animacje (szkice)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: Postacie po przecinku (art/walks.json) albo all
        required: true
        default: all
      variants:
        description: Ile wersji każdego chodu (1–4)
        required: true
        default: '1'
      max_jobs:
        description: Najwięcej animacji w tym przebiegu
        required: true
        default: '4'
      dry_run:
        description: Tylko saldo i sprawdzenie danych, bez animacji
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# The same group as the Retro Diffusion drafts: both push to art-drafts.
concurrency:
  group: art-drafts
  cancel-in-progress: false

jobs:
  walks:
    name: Chody
    runs-on: ubuntu-latest
    # An animation takes 3-5 minutes, two run at a time.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Animowanie
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
          IDS: ${{ inputs.ids }}
          VARIANTS: ${{ inputs.variants }}
          MAX_JOBS: ${{ inputs.max_jobs }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--ids "$IDS" --variants "$VARIANTS" --max-jobs "$MAX_JOBS")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node tools/animate-walks.mjs "${args[@]}"
      # Also after a failed animation: the ones already paid for are kept.
      - name: Zapis na gałęzi art-drafts
        if: ${{ always() && !inputs.dry_run }}
        env:
          IDS: ${{ inputs.ids }}
        run: |
          [ -d art/drafts ] || exit 0
          mkdir -p "$RUNNER_TEMP/drafts" && cp -r art/drafts/. "$RUNNER_TEMP/drafts/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin art-drafts; then
            git checkout -f -B art-drafts FETCH_HEAD
          else
            git checkout --orphan art-drafts
            git rm -rf --quiet .
          fi
          mkdir -p art/drafts && cp -r "$RUNNER_TEMP/drafts/." art/drafts/
          git add -f art/drafts
          git commit -m "Szkice animacji: chody ($IDS)" || exit 0
          git push origin art-drafts
