# Tests run on every push, except to the art-drafts branch. A push to main also
# deploys the game to Cloudflare (D1 database, migrations, Worker), once the two
# Cloudflare secrets exist. A push to any other branch deploys the test version
# (test.insightrpg.com, its own Worker and database) instead.

name: Testy i wdrożenie

on:
  push:
    # Sprite drafts from the "Grafiki (szkice)" workflow are not the game.
    branches-ignore:
      - art-drafts
    # Notes alone (DECISIONS.md, README.md) change nothing in the game, and
    # neither do the prompts and references for drafts (art/, audio/): the
    # game's own pictures and sounds live in src/client.
    paths-ignore:
      - '**.md'
      - 'art/**'
      - 'audio/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    # The whole suite takes about 15 minutes on GitHub's runner (0.0.74 was
    # cut off at 15), and installing the browser for the first steps may take
    # ten more (0.0.90 was cut off at 30, 2.11.2026, after 19 minutes of tests
    # and 10 of the browser), so it gets 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # A working branch at the commit main has just tested (main merged in
      # after a deploy of the game) skips a second run of the same tests.
      - name: Czy main ma ten sam commit
        id: main
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --quiet --depth=1 origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.main.outputs.same != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.main.outputs.same != 'true'
      - name: Walidacja danych gry
        if: steps.main.outputs.same != 'true'
        run: npm run validate
      - run: npm test
        if: steps.main.outputs.same != 'true'
      # The beginning of the game walked in a browser, on a phone and on a
      # computer, from the narrator's first card to the first exploration
      # (the author: "pilnuj tego na przyszlosc nie może tak byc, poczatek
      # jest najwazniejszy"). The game runs here as in the live one.
      - name: Pierwsze kroki nowej postaci
        if: steps.main.outputs.same != 'true'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --port 8787 > first-steps.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8787/api/health > /dev/null && break; sleep 2; done
          node tools/first-steps.cjs http://localhost:8787 || { tail -n 60 first-steps.log; exit 1; }

  configuration:
    name: Sprawdzenie sekretów Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ] && [ -z "$ACCOUNT" ]; then
            echo "::warning title=Wdrożenie pominięte::Brak sekretów CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID. Dodaj je według README i uruchom workflow ponownie."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error::Brakuje sekretu CLOUDFLARE_API_TOKEN (sekret z Account ID jest ustawiony)."
            exit 1
          else
            echo "::error::Brakuje sekretu CLOUDFLARE_ACCOUNT_ID (sekret z tokenem jest ustawiony)."
            exit 1
          fi

  deploy:
    name: Wdrożenie na Cloudflare
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Subdomena workers.dev i baza D1
        run: node tools/prepare-cloudflare.mjs
      - name: Migracje bazy D1
        run: npx wrangler d1 migrations apply DB --remote
      # Google sign-in needs both GitHub secrets; they go to the Worker as its
      # secrets with the deploy. Without them the Google buttons stay hidden.
      - name: Klucze logowania Google
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e 'const fs = require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET }), { mode: 0o600 });' "$RUNNER_TEMP/worker-secrets.json"
            echo "EXPECT_GOOGLE=true" >> "$GITHUB_ENV"
            echo "Logowanie Google: klucze trafią do Workera."
          elif [ -n "$GOOGLE_CLIENT_ID$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning title=Logowanie Google::Brakuje jednego z sekretów GOOGLE_CLIENT_ID i GOOGLE_CLIENT_SECRET, więc logowanie Google zostaje bez zmian."
          else
            echo "Logowanie Google: brak sekretów, przycisk Google zostaje ukryty."
          fi
      - name: Wdrożenie Workera
        shell: bash
        run: |
          # The game's number from package.json (the author: "numeruj wersje gry
          # deployowanych też 0.0.1 -> 0.0.2 itd."), then the commit.
          APP_VERSION="$(node -p "require('./package.json').version") (${GITHUB_SHA::7})"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # The stylesheet's address carries the commit, so a phone never keeps an
          # older styles.css under the new scripts (the Sklep Systemu broken on an
          # iPhone, 2.11.2026). Only this checkout's index.html changes.
          sed -i "s|href=\"/styles.css\"|href=\"/styles.css?v=${GITHUB_SHA::7}\"|" src/client/index.html
          grep -q "href=\"/styles.css?v=${GITHUB_SHA::7}\"" src/client/index.html
          secrets=()
          if [ -f "$RUNNER_TEMP/worker-secrets.json" ]; then secrets=(--secrets-file "$RUNNER_TEMP/worker-secrets.json"); fi
          npx wrangler deploy --var "APP_VERSION:$APP_VERSION" "${secrets[@]}" | tee deploy.log
          rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Sprawdzenie działania gry
        run: node tools/smoke-test.mjs deploy.log "$APP_VERSION"

  # The test version: the same game from a working branch, with its own Worker
  # and its own D1 database (the "test" environment in wrangler.jsonc), so
  # nothing there touches the live game or its players.
  test-version:
    name: Wersja testowa
    needs: test
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-version
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baza D1 wersji testowej
        run: node tools/prepare-cloudflare.mjs wzrost-test
      - name: Migracje bazy D1
        run: npx wrangler d1 migrations apply DB --remote --env test
      - name: Wdrożenie wersji testowej
        shell: bash
        run: |
          # The number of the game this test version comes from, then its commit.
          APP_VERSION="$(node -p "require('./package.json').version") (${GITHUB_SHA::7})"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # The stylesheet's address carries the commit, so a phone never keeps an
          # older styles.css under the new scripts (the Sklep Systemu broken on an
          # iPhone, 2.11.2026). Only this checkout's index.html changes.
          sed -i "s|href=\"/styles.css\"|href=\"/styles.css?v=${GITHUB_SHA::7}\"|" src/client/index.html
          grep -q "href=\"/styles.css?v=${GITHUB_SHA::7}\"" src/client/index.html
          npx wrangler deploy --env test --var "APP_VERSION:$APP_VERSION" | tee deploy.log
      - name: Sprawdzenie działania wersji testowej
        run: node tools/smoke-test.mjs deploy.log "$APP_VERSION"
