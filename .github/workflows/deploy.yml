# Tests run on every push, except to the art-drafts branch. A push to main also
# deploys the game to Cloudflare (D1 database, migrations, Worker), once the two
# Cloudflare secrets exist. A push to any other branch deploys the test version
# (test.insightrpg.com, its own Worker and database) instead.

name: Testy i wdrożenie

on:
  push:
    # Sprite drafts from the "Grafiki (szkice)" workflow are not the game.
    branches-ignore:
      - art-drafts
    # Notes alone (DECISIONS.md, README.md) change nothing in the game, and
    # neither do the prompts and references for drafts (art/, audio/): the
    # game's own pictures and sounds live in src/client.
    paths-ignore:
      - '**.md'
      - 'art/**'
      - 'audio/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite in eight parts at once, on eight runners (Node's --test-shard):
  # whole, it took about 33 minutes on one runner (0.1.69, 5.11.2026), so the
  # game waited over half an hour for every deploy (the author: "A czemu
  # 0.1.69 dalej nie jest wdrożone na main?"); in four parts the longest
  # still took 19 minutes (0.2.93, 12.11.2026; the author: "czy to
  # wdrożenie 0.2.93 nie trwa zbyt długo?"). The first steps run beside them.
  test:
    name: Testy ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      # A working branch with the very files main has just tested (main
      # merged in after a deploy of the game, as a commit of its own with
      # main's files) skips a second run of the same tests.
      - name: Czy main ma te same pliki
        id: main
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --quiet --depth=1 origin main
          if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.main.outputs.same != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.main.outputs.same != 'true'
      - name: Walidacja danych gry
        if: steps.main.outputs.same != 'true' && matrix.shard == 1
        run: npm run validate
      # Type checking of the files that start with // @ts-check (650 A).
      - name: Sprawdzanie typów
        if: steps.main.outputs.same != 'true' && matrix.shard == 2
        run: npm run typecheck
      - name: Testy, część ${{ matrix.shard }} z 8
        if: steps.main.outputs.same != 'true'
        run: node --test --test-reporter=spec --test-shard=${{ matrix.shard }}/8 'test/**/*.test.js'

  # The beginning of the game walked in a browser, on a phone and on a
  # computer, from the narrator's first card to the first exploration
  # (the author: "pilnuj tego na przyszlosc nie może tak byc, poczatek
  # jest najwazniejszy"). The game runs here as in the live one. Installing
  # the browser may take ten minutes (0.0.90, 2.11.2026), so it gets 30.
  # Ubuntu 24.04 by name: ubuntu-latest moved to 26.04 (6.11.2026), where
  # Playwright 1.56.1 installs no Chromium, and 0.1.93 and 0.1.94 stopped
  # here before the browser started.
  first-steps:
    name: Pierwsze kroki nowej postaci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Czy main ma te same pliki
        id: main
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --quiet --depth=1 origin main
          if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.main.outputs.same != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.main.outputs.same != 'true'
      - name: Pierwsze kroki nowej postaci
        if: steps.main.outputs.same != 'true'
        run: |
          npm install --no-save playwright@1.56.1
          # The browser's system packages come from Ubuntu's mirrors, whose
          # names did not resolve for 0.2.62 and 0.2.63 (11.11.2026): the
          # browser then installs without them, as the runner already holds
          # what Chromium needs (only fonts were missing). A browser that
          # cannot start still stops the walk below.
          npx playwright install --with-deps chromium || npx playwright install chromium
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --port 8787 > first-steps.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8787/api/health > /dev/null && break; sleep 2; done
          node tools/first-steps.cjs http://localhost:8787 || { tail -n 60 first-steps.log; exit 1; }
          # The game is in English too from 0.1.97: the beginning in English.
          node tools/first-steps.cjs http://localhost:8787 --lang en || { tail -n 60 first-steps.log; exit 1; }

  configuration:
    name: Sprawdzenie sekretów Cloudflare
    needs: [test, first-steps]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ] && [ -z "$ACCOUNT" ]; then
            echo "::warning title=Wdrożenie pominięte::Brak sekretów CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID. Dodaj je według README i uruchom workflow ponownie."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error::Brakuje sekretu CLOUDFLARE_API_TOKEN (sekret z Account ID jest ustawiony)."
            exit 1
          else
            echo "::error::Brakuje sekretu CLOUDFLARE_ACCOUNT_ID (sekret z tokenem jest ustawiony)."
            exit 1
          fi

  deploy:
    name: Wdrożenie na Cloudflare
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Subdomena workers.dev i baza D1
        run: node tools/prepare-cloudflare.mjs
      - name: Migracje bazy D1
        run: npx wrangler d1 migrations apply DB --remote
      # Google sign-in needs both GitHub secrets; they go to the Worker as its
      # secrets with the deploy. Without them the Google buttons stay hidden.
      - name: Klucze logowania Google
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e 'const fs = require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET }), { mode: 0o600 });' "$RUNNER_TEMP/worker-secrets.json"
            echo "EXPECT_GOOGLE=true" >> "$GITHUB_ENV"
            echo "Logowanie Google: klucze trafią do Workera."
          elif [ -n "$GOOGLE_CLIENT_ID$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning title=Logowanie Google::Brakuje jednego z sekretów GOOGLE_CLIENT_ID i GOOGLE_CLIENT_SECRET, więc logowanie Google zostaje bez zmian."
          else
            echo "Logowanie Google: brak sekretów, przycisk Google zostaje ukryty."
          fi
      # The keys of the Autopay gateway (payments for Punkty Systemu, 805 D),
      # added to the Worker's secrets beside Google's when both GitHub secrets
      # exist. The payments stay off until PAYMENTS in wrangler.jsonc names the
      # gateway.
      - name: Klucze bramki Autopay
        shell: bash
        env:
          AUTOPAY_SERVICE_ID: ${{ secrets.AUTOPAY_SERVICE_ID }}
          AUTOPAY_SHARED_KEY: ${{ secrets.AUTOPAY_SHARED_KEY }}
        run: node tools/worker-secrets.mjs "$RUNNER_TEMP/worker-secrets.json" AUTOPAY_SERVICE_ID AUTOPAY_SHARED_KEY
      - name: Wdrożenie Workera
        shell: bash
        run: |
          # The game's number from package.json (the author: "numeruj wersje gry
          # deployowanych też 0.0.1 -> 0.0.2 itd."), then the commit.
          APP_VERSION="$(node -p "require('./package.json').version") (${GITHUB_SHA::7})"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # The stylesheet's address carries the commit, so a phone never keeps an
          # older styles.css under the new scripts (the Sklep Systemu broken on an
          # iPhone, 2.11.2026). Only this checkout's index.html changes.
          sed -i "s|href=\"/styles.css\"|href=\"/styles.css?v=${GITHUB_SHA::7}\"|" src/client/index.html
          grep -q "href=\"/styles.css?v=${GITHUB_SHA::7}\"" src/client/index.html
          secrets=()
          if [ -f "$RUNNER_TEMP/worker-secrets.json" ]; then secrets=(--secrets-file "$RUNNER_TEMP/worker-secrets.json"); fi
          npx wrangler deploy --var "APP_VERSION:$APP_VERSION" "${secrets[@]}" | tee deploy.log
          rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Sprawdzenie działania gry
        run: node tools/smoke-test.mjs deploy.log "$APP_VERSION"

  # The test version: the same game from a working branch, with its own Worker
  # and its own D1 database (the "test" environment in wrangler.jsonc), so
  # nothing there touches the live game or its players.
  test-version:
    name: Wersja testowa
    needs: [test, first-steps]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-version
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baza D1 wersji testowej
        run: node tools/prepare-cloudflare.mjs wzrost-test
      - name: Migracje bazy D1
        run: npx wrangler d1 migrations apply DB --remote --env test
      # The keys of Autopay's test account, where no money moves, as the
      # Worker's AUTOPAY_SERVICE_ID and AUTOPAY_SHARED_KEY.
      - name: Klucze testowej bramki Autopay
        shell: bash
        env:
          AUTOPAY_SERVICE_ID: ${{ secrets.AUTOPAY_TEST_SERVICE_ID }}
          AUTOPAY_SHARED_KEY: ${{ secrets.AUTOPAY_TEST_SHARED_KEY }}
        run: node tools/worker-secrets.mjs "$RUNNER_TEMP/worker-secrets.json" AUTOPAY_SERVICE_ID AUTOPAY_SHARED_KEY
      - name: Wdrożenie wersji testowej
        shell: bash
        run: |
          # The number of the game this test version comes from, then its commit.
          APP_VERSION="$(node -p "require('./package.json').version") (${GITHUB_SHA::7})"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # The stylesheet's address carries the commit, so a phone never keeps an
          # older styles.css under the new scripts (the Sklep Systemu broken on an
          # iPhone, 2.11.2026). Only this checkout's index.html changes.
          sed -i "s|href=\"/styles.css\"|href=\"/styles.css?v=${GITHUB_SHA::7}\"|" src/client/index.html
          grep -q "href=\"/styles.css?v=${GITHUB_SHA::7}\"" src/client/index.html
          secrets=()
          if [ -f "$RUNNER_TEMP/worker-secrets.json" ]; then secrets=(--secrets-file "$RUNNER_TEMP/worker-secrets.json"); fi
          npx wrangler deploy --env test --var "APP_VERSION:$APP_VERSION" "${secrets[@]}" | tee deploy.log
          rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Sprawdzenie działania wersji testowej
        run: node tools/smoke-test.mjs deploy.log "$APP_VERSION"
