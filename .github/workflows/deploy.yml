# Tests run on every push, except to the art-drafts branch. A push to main also
# deploys the game to Cloudflare (D1 database, migrations, Worker), once the two
# Cloudflare secrets exist.

name: Testy i wdrożenie

on:
  push:
    # Sprite drafts from the "Grafiki (szkice)" workflow are not the game.
    branches-ignore:
      - art-drafts
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Walidacja danych gry
        run: npm run validate
      - run: npm test

  configuration:
    name: Sprawdzenie sekretów Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ] && [ -z "$ACCOUNT" ]; then
            echo "::warning title=Wdrożenie pominięte::Brak sekretów CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID. Dodaj je według README i uruchom workflow ponownie."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error::Brakuje sekretu CLOUDFLARE_API_TOKEN (sekret z Account ID jest ustawiony)."
            exit 1
          else
            echo "::error::Brakuje sekretu CLOUDFLARE_ACCOUNT_ID (sekret z tokenem jest ustawiony)."
            exit 1
          fi

  deploy:
    name: Wdrożenie na Cloudflare
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Subdomena workers.dev i baza D1
        run: node tools/prepare-cloudflare.mjs
      - name: Migracje bazy D1
        run: npx wrangler d1 migrations apply DB --remote
      - name: Wdrożenie Workera
        shell: bash
        run: |
          echo "APP_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          npx wrangler deploy --var "APP_VERSION:${GITHUB_SHA::7}" | tee deploy.log
      - name: Sprawdzenie działania gry
        run: node tools/smoke-test.mjs deploy.log "$APP_VERSION"
